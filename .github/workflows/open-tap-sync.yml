name: open-tap sync

on:
  schedule:
    # Mondays at 5:17 UTC
    - cron: 17 5 * * 1
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Checks the tap out into the workspace (no actions/checkout) and keeps
      # the token as git auth: the script pushes the sync branches with it.
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@eb02c69dbabdb66ff183c614f4ce7ab3c077592c # 2026.10.12.1
        with:
          token: ${{ github.token }}

      - run: .github/open-tap-sync.sh self-test

      - run: .github/open-tap-sync.sh
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
